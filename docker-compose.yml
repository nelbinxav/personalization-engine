services:
  api:
    build: ./backend
    container_name: pe-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      ANTHROPIC_CONFIG_DIR: /var/lib/anthropic
      CLAUDE_CONFIG_DIR: /var/lib/claude-code
    # Loopback only by default. Docker-published ports skip the host firewall,
    # so 0.0.0.0 on a server would expose the API to anything that can reach
    # the machine. Tailscale (or a tunnel) proxies to this from the host.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on: [mongo, redis]
    volumes:
      - ./backend/app:/app/app
      - anthropic_profile:/var/lib/anthropic
      - claude_code_profile:/var/lib/claude-code
      # Where Settings asks the LinkedIn service to open its sign-in browser.
      - linkedin_control:/var/lib/linkedin-control

  worker:
    build: ./backend
    container_name: pe-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      ANTHROPIC_CONFIG_DIR: /var/lib/anthropic
      CLAUDE_CONFIG_DIR: /var/lib/claude-code
    depends_on: [mongo, redis]
    volumes:
      - ./backend/app:/app/app
      # Same volume as the api: the OAuth profile written by the connect flow
      # has to be readable by the process that actually spends tokens.
      - anthropic_profile:/var/lib/anthropic
      # Claude Code's own sign-in (subscription mode). Written only by the
      # unmodified `claude` binary; the app never reads the credential in it.
      - claude_code_profile:/var/lib/claude-code
    command: ["arq", "app.worker.main.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
      args:
        # A BUILD arg, not a runtime env var: Next.js inlines NEXT_PUBLIC_* into
        # the client bundle at build time, so setting it at runtime did nothing
        # and every build called http://localhost:8000. It is the URL as the
        # BROWSER sees it; change it -> rebuild the frontend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
    container_name: pe-frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on: [api]

  # LinkedIn through a signed-in LinkedIn account: the `account` LinkedIn
  # provider, needed for recent posts. Opt-in, because it runs a browser and
  # acts as a real LinkedIn user:
  #   docker compose --profile linkedin up -d
  # Sign-in and the risks are in deploy/LINKEDIN.md. No port is published; only
  # the api and worker containers can reach it.
  linkedin:
    image: stickerdaniel/linkedin-mcp-server:4.26.1
    container_name: pe-linkedin
    profiles: ["linkedin"]
    restart: unless-stopped
    environment:
      # It refuses requests addressed to any name it was not told about.
      FASTMCP_HTTP_ALLOWED_HOSTS: '["linkedin","linkedin:8080"]'
      TOOL_TIMEOUT: "240"
      LOG_LEVEL: WARNING
    # Only the sign-in browser listens here, and only while someone is
    # connecting an account from Settings. Loopback, so it opens on this machine.
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - linkedin_profile:/home/pwuser/.linkedin-mcp
      - linkedin_control:/control
      - ./deploy/linkedin-run.sh:/usr/local/bin/pe-linkedin-run.sh:ro
      # The sign-in window with paste support, served next to the image's own.
      - ./deploy/linkedin-viewer.html:/usr/share/novnc/pe.html:ro
    # Runs the server, and its login browser when Settings asks (see the script).
    entrypoint: ["tini", "-e", "143", "--", "/bin/bash", "/usr/local/bin/pe-linkedin-run.sh"]

  mongo:
    image: mongo:7
    container_name: pe-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: pe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  anthropic_profile:
  claude_code_profile:
  linkedin_profile:
  linkedin_control:
